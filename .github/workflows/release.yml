name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing X.Y.Z release tag to build assets for
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check release packaging
        run: python3 -m unittest discover -s tests -p 'test_release.py' -v

      - name: Check customer connections
        run: php tests/logging.php

      - name: Check PHP compatibility with strict error handling
        run: php tests/php_compatibility.php

      # version.txt must match the installed manifest; ZIP root must be CustomerSystems/.
      # The builder sets both update URLs to this repository's release assets.
      - name: Build assets and validate tag against module.json
        run: |
          python3 tools/build_release.py --tag "$TAG" --repository "$GH_REPO"
          unzip -l dist/CustomerSystems.zip

      # As in sidebar-webhook PR #22: upload assets before publishing a new release.
      - name: Publish release assets
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/CustomerSystems.zip dist/version.txt --clobber
          else
            gh release create "$TAG" dist/CustomerSystems.zip dist/version.txt --verify-tag --title "$TAG" --generate-notes
          fi
